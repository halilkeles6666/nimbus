# Render Blueprint for the Nimbus store (deploy separately from Klaxon).
services:
  - type: web
    name: nimbus
    runtime: ruby
    plan: free
    buildCommand: "bundle install"
    startCommand: "bundle exec puma -p $PORT"
    envVars:
      # Klaxon's ingest URL; the telemetry URL is derived from it.
      # e.g. https://klaxon-wgno.onrender.com/api/alerts
      - key: KLAXON_INGEST_URL
        sync: false
